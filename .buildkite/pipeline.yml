agents:
  queue: "linux-small"

steps:
  - label: ":microscope: Phase 20 claimed AI extraction"
    key: "phase20-claimed-ai-extraction"
    timeout_in_minutes: 50
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl python3 python3-pip python3-venv
        python3 -m venv /tmp/shalcon-venv
        . /tmp/shalcon-venv/bin/activate
        python -m pip install -e "apps/local-runner[dev]"
        python -m playwright install --with-deps chromium

        export SHALCON_RUNNER_TOKEN="$(node -e "process.stdout.write(require(\"crypto\").randomBytes(32).toString(\"hex\"))")"
        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));const candidates=t.prospects.filter(p=>p.sourceClass===\"OFFICIAL_WEBSITE\").slice(1,2).map(({id,businessName,location,sourceUrl,officialWebsite})=>({id,businessName,location,sourceUrl,officialWebsite}));if(candidates.length!==1||!candidates[0].officialWebsite||!process.env.SHALCON_RUNNER_TOKEN)process.exit(11);fs.writeFileSync(\"/tmp/p20-live.json\",JSON.stringify({candidates,runnerToken:process.env.SHALCON_RUNNER_TOKEN}));"

        rm -rf .wrangler/phase20-research-pilot
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npx wrangler dev src/phase20-live-research.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-live.log 2>&1 &
        worker_pid=$!
        ollama_pid=""
        cleanup() {
          kill "$worker_pid" 2>/dev/null || true
          if [ -n "$ollama_pid" ]; then kill "$ollama_pid" 2>/dev/null || true; fi
        }
        trap cleanup EXIT
        cd ../..

        node -e "const fs=require(\"fs\");const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));(async()=>{let ready=false;for(let i=1;i<=60;i++){try{const r=await fetch(\"http://127.0.0.1:8807/phase20/health\");if(r.status===200){ready=true;break;}}catch{}await sleep(1000);}if(!ready)process.exit(2);const payload=fs.readFileSync(\"/tmp/p20-live.json\",\"utf8\");const r=await fetch(\"http://127.0.0.1:8807/phase20/setup\",{method:\"POST\",headers:{\"content-type\":\"application/json\"},body:payload});const body=await r.text();console.log(\"setup\",r.status,body);if(r.status!==201)process.exit(3);const p=JSON.parse(body);if(p.created?.length!==1||p.created[0]?.state!==\"IDENTITY_VERIFIED\"||p.created[0]?.identityStatus!==\"NEW_CANONICAL\"||p.trialResultsModified!==false)process.exit(4);})().catch(e=>{console.error(e);process.exit(5);});"

        PYTHONPATH=apps/local-runner/src python scripts/phase20-research-pilot.py --api-url http://127.0.0.1:8807 --jobs 1
        node -e "(async()=>{const r=await fetch(\"http://127.0.0.1:8807/phase20/status\");const s=await r.json();const pending=s.aiJobs?.filter(x=>x.status===\"PENDING\")??[];console.log(JSON.stringify(s));if(r.status!==200||pending.length<1||pending.length>6||s.researchRuns?.[0]?.status!==\"RUNNING\"||s.trialResultsModified!==false)process.exit(6);})().catch(e=>{console.error(e);process.exit(7);});"

        curl -fsSL https://ollama.com/install.sh | sh
        export OLLAMA_NUM_PARALLEL=1
        export OLLAMA_MAX_LOADED_MODELS=1
        export SHALCON_OLLAMA_MODEL="qwen3:0.6b"
        ollama serve > /tmp/ollama.log 2>&1 &
        ollama_pid=$!
        ready=0
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:11434/api/tags >/tmp/ollama-tags.json; then ready=1; break; fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then cat /tmp/ollama.log || true; exit 21; fi
        ollama pull "$SHALCON_OLLAMA_MODEL"

        PYTHONPATH=apps/local-runner/src python - <<"PY"
import json, os
from shalcon_runner.ai_extract import ai_extract_job
from shalcon_runner.client import RunnerApiClient

client = RunnerApiClient("http://127.0.0.1:8807", os.environ["SHALCON_RUNNER_TOKEN"], timeout_seconds=30.0)
client.heartbeat("phase20-ai-probe", ["LOCAL_AI_EXTRACT"])
job = client.claim()
if job is None or job.job_type != "LOCAL_AI_EXTRACT":
    raise SystemExit("expected a LOCAL_AI_EXTRACT job")
result = ai_extract_job(job)
if result.get("sourceOnly") is not True or result.get("verified") is not False or result.get("provider") != "ollama":
    raise SystemExit("real AI extraction result invariants failed")
print(json.dumps({"ok": True, "jobId": job.id, "sourceChars": len(job.payload.get("sourceText", "")), "provider": result.get("provider"), "model": result.get("model"), "adapter": result.get("adapter"), "extractedFields": sorted(result.get("extracted", {}).keys())}, sort_keys=True))
PY
      ' || { rc=$?; cat /tmp/phase20-live.log 2>/dev/null || true; cat /tmp/ollama.log 2>/dev/null || true; exit $rc; }
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
