agents:
  queue: "linux-small"

steps:
  - label: ":page_facing_up: Phase 20 payload generation"
    key: "phase20-payload-generation"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));const p=t.prospects.find(x=>x.sourceClass===\"OFFICIAL_WEBSITE\");if(!p)throw new Error(\"No official-site prospect found\");const candidate={id:p.id,businessName:p.businessName,location:p.location,sourceUrl:p.sourceUrl,officialWebsite:p.officialWebsite};fs.writeFileSync(\"/tmp/phase20-payload.json\",JSON.stringify({candidates:[candidate]}));"
        node -e "const fs=require(\"fs\");const v=JSON.parse(fs.readFileSync(\"/tmp/phase20-payload.json\",\"utf8\"));if(!Array.isArray(v.candidates)||v.candidates.length!==1||!v.candidates[0].id)process.exit(1);console.log(JSON.stringify(v));"
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
