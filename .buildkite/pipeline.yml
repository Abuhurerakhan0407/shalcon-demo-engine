agents:
  queue: "linux-small"

steps:
  - label: ":database: Phase 11 D1 regression chain"
    key: "phase11-d1-regression-chain"
    timeout_in_minutes: 30
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        test -f package-lock.json
        npm ci
        npm run test:phase1:d1
        npm run test:phase2:d1
        npm run test:phase4:d1
        npm run test:phase5:d1
        npm run test:phase6:d1
        npm run test:phase7:d1
        npm run test:phase8:d1
        npm run test:phase9:d1
        npm run test:phase11:d1
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
