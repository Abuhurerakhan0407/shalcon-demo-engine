agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 evidence review exact lint isolation"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci

        npx eslint apps/api/src/evidence-verification.ts || { sleep 10; exit 1; }
        npx eslint apps/api/src/evidence-review-routes.ts || { sleep 35; exit 1; }
        npx eslint apps/api/src/phase20-evidence-review.integration.ts || { sleep 60; exit 1; }
        npx eslint apps/api/src/index-with-evidence-review.ts || { sleep 85; exit 1; }
        npx eslint scripts/phase20-evidence-review-check.mjs || { sleep 110; exit 1; }
        sleep 135
        npm run lint
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
