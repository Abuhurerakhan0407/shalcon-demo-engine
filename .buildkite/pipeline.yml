agents:
  queue: "linux-small"

steps:
  - label: ":cloudflare: Phase 14 worker startup"
    key: "phase14-worker-startup"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs
        npm ci
        rm -rf .wrangler/phase14-startup-test
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase14-startup-test
        npx wrangler dev src/phase14.integration.ts --local --port 8801 --persist-to ../../.wrangler/phase14-startup-test > /tmp/phase14-worker.log 2>&1 &
        worker=$!
        trap "kill $worker 2>/dev/null || true" EXIT
        sleep 6
        if ! kill -0 $worker 2>/dev/null; then
          cat /tmp/phase14-worker.log
          exit 1
        fi
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
