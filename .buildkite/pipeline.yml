agents:
  queue: "linux-small"

steps:
  - label: ":test_tube: Phase 17 upstream isolation"
    key: "phase17-prebuild"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs
        npm ci
        rm -rf .wrangler/phase17-d1-test
        npm --workspace @shalcon/api run db:migrate:phase17:local
        npm --workspace @shalcon/api exec -- wrangler dev src/phase17-prebuild.integration.ts --local --port 8805 --persist-to ../../.wrangler/phase17-d1-test > /tmp/p17-prebuild.log 2>&1 &
        worker=$!
        trap "kill $worker >/dev/null 2>&1 || true" EXIT
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8805/healthz >/dev/null; then break; fi
          sleep 1
        done
        response=$(curl -fsS http://127.0.0.1:8805/phase17-prebuild) || { cat /tmp/p17-prebuild.log; exit 1; }
        printf "%s\n" "$response"
        printf "%s" "$response" | grep -q '"'"'"ok"'"'":true'
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
