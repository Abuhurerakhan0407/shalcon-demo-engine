agents:
  queue: "linux-small"

steps:
  - label: ":arrow_down: Phase 20 GET transport"
    key: "phase20-get-transport"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler dev src/phase20-setup-control.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-get.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        ready=0
        for _ in $(seq 1 60); do
          status="$(curl -sS -o /tmp/phase20-get-response.json -w "%{http_code}" http://127.0.0.1:8807/phase20-setup-control || true)"
          if [ "$status" != "000" ]; then
            ready=1
            break
          fi
          sleep 1
        done
        cat /tmp/phase20-get-response.json 2>/dev/null || true
        if [ "$ready" -ne 1 ] || [ "$status" != "200" ]; then
          cat /tmp/phase20-get.log
          exit 1
        fi
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
