agents:
  queue: "linux-small"

steps:
  - label: ":incoming_envelope: Phase 20 POST via Node fetch"
    key: "phase20-post-node-fetch"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        npm --workspace @shalcon/api exec -- wrangler dev src/phase20-setup-control.integration.ts --local --port 8807 > /tmp/phase20-post-node.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT

        node -e "const sleep=(ms)=>new Promise(r=>setTimeout(r,ms)); (async()=>{let ready=false; for(let i=1;i<=60;i++){try{const r=await fetch(\"http://127.0.0.1:8807/phase20-health-control\"); if(r.status===200){ready=true; console.log(\"health ready\",i); break;}}catch{} await sleep(1000);} if(!ready){console.error(\"health never ready\"); process.exit(2);} const r=await fetch(\"http://127.0.0.1:8807/phase20-setup-control\",{method:\"POST\"}); const body=await r.text(); console.log(\"POST status\",r.status); console.log(body); if(r.status!==201) process.exit(3);})().catch(e=>{console.error(e);process.exit(4);});"
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
