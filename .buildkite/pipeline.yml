agents:
  queue: "linux-small"

steps:
  - label: ":lock: Phase 20 trial ledger gate"
    key: "phase20-trial-ledger-gate"
    timeout_in_minutes: 15
    command: |
      bash -lc '
        set -euo pipefail

        node scripts/phase20-trial-report.mjs

        if node scripts/phase20-trial-report.mjs --enforce; then
          echo "expected --enforce to fail while real trial results are pending"
          exit 12
        fi

        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));t.prospects[0].result={status:\"COMPLETE\",factualCorrectionRequired:false,criticalFactualError:false,correctionCategories:{wrongIdentity:false,wrongFact:false,missingFact:false,wrongTemplate:false,badCopy:false,badImage:false,contactProblem:false,manualCorrectionRequired:false}};fs.writeFileSync(\"/tmp/p20-bad.json\",JSON.stringify(t));"
        if node scripts/phase20-trial-report.mjs --file=/tmp/p20-bad.json; then
          echo "expected malformed COMPLETE result to fail when one correction category is missing"
          exit 13
        fi

        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));const keys=[\"wrongIdentity\",\"wrongFact\",\"missingFact\",\"wrongTemplate\",\"badCopy\",\"badImage\",\"visualBug\",\"contactProblem\",\"manualCorrectionRequired\"];t.prospects[0].result={status:\"COMPLETE\",factualCorrectionRequired:false,criticalFactualError:false,correctionCategories:Object.fromEntries(keys.map(k=>[k,false]))};fs.writeFileSync(\"/tmp/p20-good.json\",JSON.stringify(t));"
        node scripts/phase20-trial-report.mjs --file=/tmp/p20-good.json
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
