agents:
  queue: "linux-small"

steps:
  - label: ":link: Phase 20 Shanuzz final URL uniqueness"
    key: "phase20-shanuzz-final-url-uniqueness"
    timeout_in_minutes: 40
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        python -m pip install -e apps/local-runner
        python -m playwright install --with-deps chromium
        PYTHONPATH=apps/local-runner/src python -c "from shalcon_runner.research import BrowserResearchEngine; r=BrowserResearchEngine().research(job_id=\"job_shanuzz_probe\",prospect_id=\"pro_shanuzz_probe\",raw_url=\"https://shanuzz.com/\",max_pages=4); finals=[p[\"finalUrl\"] for p in r[\"pages\"]]; print(finals); assert len(finals)==len(set(finals)), finals"
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
