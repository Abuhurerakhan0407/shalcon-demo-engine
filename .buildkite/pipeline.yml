agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 evidence review lint isolation"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci

        npx eslint apps/api/src/evidence-verification.ts || { sleep 8; exit 1; }
        npx eslint apps/api/src/evidence-review-routes.ts || { sleep 18; exit 1; }
        npx eslint apps/api/src/phase20-evidence-review.integration.ts || { sleep 28; exit 1; }
        npx eslint apps/api/src/index-with-evidence-review.ts || { sleep 38; exit 1; }
        npx eslint scripts/phase20-evidence-review-check.mjs || { sleep 48; exit 1; }

        npm run lint
        npm run typecheck

        rm -rf .wrangler/phase20-evidence-review
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-evidence-review
        npx wrangler dev src/phase20-evidence-review.integration.ts --local --port 8808 --persist-to ../../.wrangler/phase20-evidence-review > /tmp/phase20-evidence-review.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        cd ../..

        node scripts/phase20-evidence-review-check.mjs || { rc=$?; cat /tmp/phase20-evidence-review.log || true; exit $rc; }
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
