agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 root static isolation"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci
        npm run typecheck || { sleep 20; exit 1; }
        npm run lint || { sleep 70; exit 1; }
        exit 0
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
