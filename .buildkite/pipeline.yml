agents:
  queue: "linux-small"

steps:
  - label: ":database: Phase 14 integration runtime"
    key: "phase14-runtime"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs
        npm ci
        rm -rf .wrangler/phase14-runtime-test
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase14-runtime-test
        npx wrangler dev src/phase14.integration.ts --local --port 8801 --persist-to ../../.wrangler/phase14-runtime-test > /tmp/phase14-worker.log 2>&1 &
        worker=$!
        trap "kill $worker 2>/dev/null || true" EXIT
        for i in $(seq 1 100); do
          if curl -fsS http://127.0.0.1:8801/phase14 > /tmp/phase14-result.json; then
            exit 0
          fi
          if ! kill -0 $worker 2>/dev/null; then
            cat /tmp/phase14-worker.log
            exit 1
          fi
          sleep 0.4
        done
        cat /tmp/phase14-worker.log
        exit 1
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
