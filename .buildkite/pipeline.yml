agents:
  queue: "linux-small"

steps:
  - label: ":id: Phase 20 listing identities 14-16"
    key: "phase20-listing-identities-14-16"
    timeout_in_minutes: 30
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        export SHALCON_RUNNER_TOKEN="$(node -e "process.stdout.write(require(\"crypto\").randomBytes(32).toString(\"hex\"))")"
        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));const candidates=t.prospects.filter(p=>p.sourceClass===\"PUBLIC_LISTING\").slice(0,3).map(({id,businessName,location,sourceUrl,officialWebsite})=>({id,businessName,location,sourceUrl,officialWebsite}));if(candidates.length!==3||candidates.some(x=>x.officialWebsite!==null)||!process.env.SHALCON_RUNNER_TOKEN)process.exit(11);fs.writeFileSync(\"/tmp/p20-listing.json\",JSON.stringify({candidates,runnerToken:process.env.SHALCON_RUNNER_TOKEN}));"

        rm -rf .wrangler/phase20-research-pilot
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npx wrangler dev src/phase20-live-research.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-listing.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        cd ../..

        node -e "const fs=require(\"fs\");const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));(async()=>{let ready=false;for(let i=1;i<=60;i++){try{const r=await fetch(\"http://127.0.0.1:8807/phase20/health\");if(r.status===200){ready=true;break;}}catch{}await sleep(1000);}if(!ready)process.exit(2);const payload=fs.readFileSync(\"/tmp/p20-listing.json\",\"utf8\");const r=await fetch(\"http://127.0.0.1:8807/phase20/setup\",{method:\"POST\",headers:{\"content-type\":\"application/json\"},body:payload});const body=await r.text();console.log(\"setup\",r.status,body);if(r.status!==201)process.exit(3);const p=JSON.parse(body);const ids=p.created?.map(x=>x.prospectId)??[];if(p.created?.length!==3||new Set(ids).size!==3||p.created.some(x=>x.state!==\"IDENTITY_VERIFIED\"||x.identityStatus!==\"NEW_CANONICAL\")||p.trialResultsModified!==false)process.exit(4);const sr=await fetch(\"http://127.0.0.1:8807/phase20/status\");const s=await sr.json();console.log(JSON.stringify(s));const pending=s.researchJobs?.filter(x=>x.status===\"PENDING\")??[];if(sr.status!==200||s.prospects?.length!==3||pending.length!==3||s.prospects.some(x=>x.sourceCount!==0)||s.foreignKeyViolations!==0||s.trialResultsModified!==false)process.exit(5);})().catch(e=>{console.error(e);process.exit(6);});" || { rc=$?; cat /tmp/phase20-listing.log || true; exit $rc; }
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
