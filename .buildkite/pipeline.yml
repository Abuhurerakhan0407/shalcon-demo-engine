agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 operator lint isolation"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci
        npx eslint apps/api/src/phase20-live-research.integration.ts || { sleep 15; exit 1; }
        npx eslint apps/api/src/phase20-operator.integration.ts || { sleep 40; exit 1; }
        npx eslint scripts/phase20-operator-shell-check.mjs || { sleep 65; exit 1; }
        npx eslint scripts/phase20-operator-seed.mjs || { sleep 90; exit 1; }
        exit 0
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
