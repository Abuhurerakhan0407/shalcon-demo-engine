agents:
  queue: "linux-small"

steps:
  - label: ":white_check_mark: Phase 20 evidence review operator workflow"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci
        npm run typecheck
        npx eslint \
          apps/api/src/evidence-verification.ts \
          apps/api/src/evidence-review-routes.ts \
          apps/api/src/phase20-evidence-review.integration.ts \
          apps/api/src/phase20-live-research.integration.ts \
          apps/api/src/phase20-operator.integration.ts \
          apps/api/src/index-with-evidence-review.ts \
          scripts/phase20-evidence-review-check.mjs \
          scripts/phase20-operator-shell-check.mjs \
          scripts/phase20-operator-seed.mjs \
          scripts/phase20-trial-report.mjs \
          apps/web/src/App.tsx \
          apps/web/src/review/EvidenceReviewPage.tsx
        npm --workspace @shalcon/web run build
        node scripts/phase20-trial-report.mjs

        rm -rf .wrangler/phase20-evidence-review
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-evidence-review
        npx wrangler dev src/phase20-evidence-review.integration.ts --local --port 8808 --persist-to ../../.wrangler/phase20-evidence-review > /tmp/phase20-evidence-review.log 2>&1 &
        review_pid=$!
        trap "kill $review_pid 2>/dev/null || true" EXIT
        cd ../..
        node scripts/phase20-evidence-review-check.mjs || { rc=$?; cat /tmp/phase20-evidence-review.log || true; exit $rc; }
        kill "$review_pid" 2>/dev/null || true
        wait "$review_pid" 2>/dev/null || true
        trap - EXIT

        rm -rf .wrangler/phase20-operator-shell
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-operator-shell
        npx wrangler dev src/phase20-operator.integration.ts --local --port 8809 --persist-to ../../.wrangler/phase20-operator-shell > /tmp/phase20-operator-shell.log 2>&1 &
        operator_pid=$!
        trap "kill $operator_pid 2>/dev/null || true" EXIT
        cd ../..
        node scripts/phase20-operator-shell-check.mjs || { rc=$?; cat /tmp/phase20-operator-shell.log || true; exit $rc; }
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
