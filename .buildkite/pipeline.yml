agents:
  queue: "linux-small"

steps:
  - label: ":microscope: Phase 20 Playwright environment"
    key: "phase20-playwright-environment"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl python3 python3-pip python3-venv
        python3 -m venv /tmp/shalcon-venv
        . /tmp/shalcon-venv/bin/activate
        python -m pip install -e "apps/local-runner[dev]"
        echo "runner-installed"

        python -m playwright install --with-deps chromium
        echo "chromium-installed"
        PYTHONPATH=apps/local-runner/src python -m pytest apps/local-runner/tests/test_research.py -q
        echo "research-regression-passed"
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
