agents:
  queue: "linux-small"

steps:
  - label: ":incoming_envelope: Phase 20 POST transport diagnostic"
    key: "phase20-post-after-readiness"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler dev src/phase20-setup-control.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-post-ready.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT

        ready=0
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8807/phase20-health-control >/dev/null; then
            ready=1
            echo "health ready on attempt $attempt"
            break
          fi
          sleep 1
        done

        if [ "$ready" -ne 1 ]; then
          echo "health endpoint never became ready"
          cat /tmp/phase20-post-ready.log || true
          exit 1
        fi

        if ! kill -0 "$worker_pid" 2>/dev/null; then
          echo "wrangler process exited immediately after readiness"
          cat /tmp/phase20-post-ready.log || true
          exit 1
        fi

        post_ok=0
        status="000"
        curl_rc=0
        for attempt in $(seq 1 5); do
          rm -f /tmp/phase20-post-ready-response.json
          set +e
          status="$(curl -sS -o /tmp/phase20-post-ready-response.json -w "%{http_code}" -X POST http://127.0.0.1:8807/phase20-setup-control)"
          curl_rc=$?
          set -e

          echo "POST attempt $attempt: curl_rc=$curl_rc status=$status"
          cat /tmp/phase20-post-ready-response.json 2>/dev/null || true
          echo

          if [ "$curl_rc" -eq 0 ] && [ "$status" = "201" ]; then
            post_ok=1
            break
          fi

          if [ "$curl_rc" -eq 0 ]; then
            break
          fi

          if ! kill -0 "$worker_pid" 2>/dev/null; then
            echo "wrangler process exited during POST transport retries"
            break
          fi
          sleep 1
        done

        if [ "$post_ok" -ne 1 ]; then
          echo "POST transport control failed: curl_rc=$curl_rc status=$status"
          cat /tmp/phase20-post-ready.log || true
          exit 1
        fi
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
