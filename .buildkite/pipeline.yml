agents:
  queue: "linux-small"

steps:
  - label: ":microscope: Phase 20 AI route boot isolation"
    key: "phase20-ai-route-boot"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        npm ci
        npm run typecheck

        rm -rf .wrangler/phase20-research-pilot
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npx wrangler dev src/phase20-live-research.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-live.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        cd ../..

        node -e "const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));(async()=>{for(let i=0;i<60;i++){try{const r=await fetch(\"http://127.0.0.1:8807/phase20/health\");const b=await r.json();console.log(r.status,JSON.stringify(b));if(r.status===200&&b.ok===true&&b.phase===20)return;}catch{}await sleep(1000);}process.exit(2);})().catch(e=>{console.error(e);process.exit(3);});" || { rc=$?; cat /tmp/phase20-live.log || true; exit $rc; }
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
