agents:
  queue: "linux-small"

steps:
  - label: ":heartbeat: Phase 20 real integration boot with D1"
    key: "phase20-real-boot-d1"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler dev src/phase20-research-pilot.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-real-boot.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT

        node -e "const sleep=(ms)=>new Promise(r=>setTimeout(r,ms)); (async()=>{for(let i=1;i<=60;i++){try{const r=await fetch(\"http://127.0.0.1:8807/phase20/health\"); const body=await r.text(); console.log(\"health attempt\",i,\"status\",r.status,body); if(r.status===200) process.exit(0);}catch(e){if(i===60) console.error(e);} await sleep(1000);} process.exit(2);})().catch(e=>{console.error(e);process.exit(3);});" || { rc=$?; echo "health probe failed rc=$rc"; cat /tmp/phase20-real-boot.log || true; exit $rc; }
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
