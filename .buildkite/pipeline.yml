agents:
  queue: "linux-small"

steps:
  - label: ":python: Python regression under Phase 13"
    key: "phase13-python-regression"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        python --version
        python -m pip install -e "apps/local-runner[dev]"
        python -m playwright install --with-deps --only-shell chromium
        npm --version >/dev/null 2>&1 || true
        cd apps/local-runner
        PYTHONPATH=src python -m pytest tests -q
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
