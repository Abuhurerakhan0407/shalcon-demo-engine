agents:
  queue: "linux-small"

steps:
  - label: ":shield: Phase 20 Shanuzz URL safety"
    key: "phase20-shanuzz-url-safety"
    timeout_in_minutes: 10
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        PYTHONPATH=apps/local-runner/src python -c "from shalcon_runner.url_safety import validate_public_http_url; value=validate_public_http_url(\"https://shanuzz.com/\"); print(value); assert value==\"https://shanuzz.com/\""
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
