agents:
  queue: "linux-small"

steps:
  - label: ":worker: Phase 15 worker boot"
    key: "phase15-worker-boot"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase15-d1-test
        npm --workspace @shalcon/api run db:migrate:phase15:local
        npm --workspace @shalcon/api run test:d1:phase15-worker >/tmp/phase15-worker.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8802/healthz >/tmp/phase15-health.json; then
            cat /tmp/phase15-health.json
            exit 0
          fi
          if ! kill -0 $worker_pid 2>/dev/null; then
            cat /tmp/phase15-worker.log
            exit 1
          fi
          sleep 1
        done
        cat /tmp/phase15-worker.log
        exit 1
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
