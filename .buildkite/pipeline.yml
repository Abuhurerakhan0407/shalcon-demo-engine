agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 pilot setup isolation"
    key: "phase20-pilot-setup"
    timeout_in_minutes: 45
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        python -m pip install -e "apps/local-runner[dev]"
        python -m playwright install --with-deps chromium

        npm run typecheck
        npm run lint
        node scripts/phase20-trial-report.mjs
        PHASE20_PILOT_JOBS=0 node scripts/verify-phase20-research-pilot.mjs
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
