agents:
  queue: "linux-small"

steps:
  - label: ":white_check_mark: Phase 20 operator workspace"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci
        npm run typecheck
        npx eslint \
          apps/api/src/evidence-verification.ts \
          apps/api/src/evidence-review-routes.ts \
          apps/api/src/phase20-evidence-review.integration.ts \
          apps/api/src/phase20-live-research.integration.ts \
          apps/api/src/phase20-operator.integration.ts \
          apps/api/src/index-with-evidence-review.ts \
          scripts/phase20-evidence-review-check.mjs \
          scripts/phase20-operator-shell-check.mjs \
          scripts/phase20-operator-seed.mjs \
          scripts/phase20-export-review-packet.mjs \
          scripts/phase20-trial-report.mjs \
          apps/web/src/App.tsx \
          apps/web/src/review/EvidenceReviewPage.tsx
        npm --workspace @shalcon/web run build
        node scripts/phase20-trial-report.mjs

        rm -rf .wrangler/phase20-evidence-review-ci
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-evidence-review-ci
        npx wrangler dev src/phase20-evidence-review.integration.ts --local --port 8808 --persist-to ../../.wrangler/phase20-evidence-review-ci > /tmp/phase20-evidence-review.log 2>&1 &
        review_pid=$!
        cd ../..
        trap "kill $review_pid 2>/dev/null || true" EXIT
        node scripts/phase20-evidence-review-check.mjs || { rc=$?; cat /tmp/phase20-evidence-review.log || true; exit $rc; }
        kill "$review_pid" 2>/dev/null || true
        wait "$review_pid" 2>/dev/null || true
        trap - EXIT

        rm -rf .wrangler/phase20-operator-shell-ci
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-operator-shell-ci
        npx wrangler dev src/phase20-operator.integration.ts --local --port 8809 --persist-to ../../.wrangler/phase20-operator-shell-ci > /tmp/phase20-operator-shell.log 2>&1 &
        shell_pid=$!
        cd ../..
        trap "kill $shell_pid 2>/dev/null || true" EXIT
        node scripts/phase20-operator-shell-check.mjs || { rc=$?; cat /tmp/phase20-operator-shell.log || true; exit $rc; }
        PHASE20_OPERATOR_BASE_URL=http://127.0.0.1:8809 node scripts/phase20-export-review-packet.mjs --out=/tmp/phase20-review-packet.json
        node -e "const fs=require(\"node:fs\");const packet=JSON.parse(fs.readFileSync(\"/tmp/phase20-review-packet.json\",\"utf8\"));if(packet.phase!==20||packet.mode!==\"LOCAL_OPERATOR_REVIEW_PACKET\"||packet.prospectCount!==2||packet.trialResultsModified!==false||packet.foreignKeyViolations!==0)process.exit(41);"
        kill "$shell_pid" 2>/dev/null || true
        wait "$shell_pid" 2>/dev/null || true
        trap - EXIT

        rm -rf .wrangler/phase20-operator-seed-ci
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-operator-seed-ci
        npx wrangler dev src/phase20-operator.integration.ts --local --port 8810 --persist-to ../../.wrangler/phase20-operator-seed-ci > /tmp/phase20-operator-seed.log 2>&1 &
        seed_pid=$!
        cd ../..
        trap "kill $seed_pid 2>/dev/null || true" EXIT
        export PHASE20_OPERATOR_BASE_URL=http://127.0.0.1:8810
        export SHALCON_RUNNER_TOKEN=phase20-seed-check-token-00000001
        node scripts/phase20-operator-seed.mjs || { rc=$?; cat /tmp/phase20-operator-seed.log || true; exit $rc; }
        node scripts/phase20-export-review-packet.mjs --out=/tmp/phase20-seeded-review-packet.json
        node -e "const fs=require(\"node:fs\");const packet=JSON.parse(fs.readFileSync(\"/tmp/phase20-seeded-review-packet.json\",\"utf8\"));if(packet.phase!==20||packet.prospectCount!==20||packet.trialResultsModified!==false||packet.foreignKeyViolations!==0)process.exit(42);"
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
