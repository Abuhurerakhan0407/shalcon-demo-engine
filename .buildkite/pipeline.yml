agents:
  queue: "linux-small"

steps:
  - label: ":package: Phase 20 Worker via npm workspace"
    key: "phase20-worker-npm-workspace"
    timeout_in_minutes: 30
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npm --workspace @shalcon/api exec -- wrangler dev src/phase20-db-probe.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-db-probe.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        ready=0
        for _ in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8807/phase20/db-schema-probe >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          cat /tmp/phase20-db-probe.log
          exit 1
        fi
        write_status="$(curl -sS -o /tmp/phase20-db-write.json -w "%{http_code}" http://127.0.0.1:8807/phase20/db-write-probe)"
        cat /tmp/phase20-db-write.json
        if [ "$write_status" != "200" ]; then
          cat /tmp/phase20-db-probe.log
          exit 1
        fi
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
