agents:
  queue: "linux-small"

steps:
  - label: ":snake: Phase 18 worker contract"
    key: "phase18-worker-contract"
    timeout_in_minutes: 20
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        python -m pip install -e "apps/local-runner[dev]"
        cd apps/local-runner
        PYTHONPATH=src python -m pytest tests/test_worker.py -q
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
