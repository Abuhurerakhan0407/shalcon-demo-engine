agents:
  queue: "linux-small"

steps:
  - label: ":card_file_box: Phase 20 direct D1 persistence probe"
    key: "phase20-direct-d1-probe"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        rm -rf .wrangler/phase20-research-pilot
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npx wrangler d1 execute DB --local --persist-to ../../.wrangler/phase20-research-pilot --command "SELECT COUNT(*) AS user_count FROM users"
        npx wrangler d1 execute DB --local --persist-to ../../.wrangler/phase20-research-pilot --command "INSERT INTO users(id,email,name,created_at) VALUES (\"phase20-cli-probe\",\"phase20-cli-probe@example.invalid\",\"Phase 20 CLI Probe\",\"2026-09-14T05:00:00.000Z\")"
        npx wrangler d1 execute DB --local --persist-to ../../.wrangler/phase20-research-pilot --command "SELECT id FROM users WHERE id=\"phase20-cli-probe\""
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
