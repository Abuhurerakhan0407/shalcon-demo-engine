agents:
  queue: "linux-small"

steps:
  - label: ":mag: Phase 20 evidence review typecheck isolation"
    key: "phase20-evidence-review-workflow"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true
        npm ci

        npm --workspace @shalcon/api run typecheck || { sleep 15; exit 1; }
        npm --workspace @shalcon/web run typecheck || { sleep 35; exit 1; }
        npm run lint || { sleep 55; exit 1; }

        sleep 75
        exit 1
      '
    plugins:
      - docker#v5.13.0:
          image: "node:22-bookworm"
          workdir: /workdir
          mount-checkout: true
