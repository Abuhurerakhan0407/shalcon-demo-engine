agents:
  queue: "linux-small"

steps:
  - label: ":bust_in_silhouette: Phase 20 user setup isolation"
    key: "phase20-pilot-user-setup"
    timeout_in_minutes: 25
    command: |
      bash -lc '
        set -euo pipefail
        export CI=true

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y --no-install-recommends nodejs

        npm ci
        node -e "const fs=require(\"fs\");const t=JSON.parse(fs.readFileSync(\"docs/phase20-salon-accuracy-trial.json\",\"utf8\"));const candidates=t.prospects.filter(p=>p.sourceClass===\"OFFICIAL_WEBSITE\").slice(0,1).map(({id,businessName,location,sourceUrl,officialWebsite})=>({id,businessName,location,sourceUrl,officialWebsite}));fs.writeFileSync(\"/tmp/phase20-setup.json\",JSON.stringify({candidates,stopAfter:\"USER\"}));"
        rm -rf .wrangler/phase20-research-pilot
        cd apps/api
        npx wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/phase20-research-pilot
        npx wrangler dev src/phase20-research-pilot.integration.ts --local --port 8807 --persist-to ../../.wrangler/phase20-research-pilot > /tmp/phase20-pilot-worker.log 2>&1 &
        worker_pid=$!
        trap "kill $worker_pid 2>/dev/null || true" EXIT
        ready=0
        for _ in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8807/phase20/health >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          cat /tmp/phase20-pilot-worker.log
          exit 1
        fi
        setup_status="$(curl -sS -o /tmp/phase20-setup-response.json -w "%{http_code}" -H "Content-Type: application/json" --data-binary @/tmp/phase20-setup.json http://127.0.0.1:8807/phase20/setup)"
        cat /tmp/phase20-setup-response.json
        if [ "$setup_status" != "201" ]; then
          cat /tmp/phase20-pilot-worker.log
          exit 1
        fi
      '
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-bookworm"
          workdir: /workdir
          mount-checkout: true
