name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bootstrap npm lockfile once
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already tracked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: add npm lockfile'
          git push origin HEAD:main
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Smoke Worker dev server
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace @shalcon/api run dev -- --port 8787 > /tmp/shalcon-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health > /tmp/shalcon-health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/shalcon-worker.log
            exit 1
          fi

          cat /tmp/shalcon-health.json
      - run: npm run test:phase0:audit

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e 'apps/local-runner[dev]'
      - run: python -m pytest apps/local-runner/tests -q
