name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:phase1:d1
      - run: npm run test:phase2:d1
      - run: npm run test:phase4:d1
      - run: npm run test:phase5:d1
      - run: npm run test:phase6:d1
      - run: npm run test:phase7:d1
      - run: npm run test:phase8:d1
      - run: npm run test:phase9:d1
      - run: npm run build
      - name: Smoke Worker dev server
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace @shalcon/api run dev -- --port 8787 > /tmp/shalcon-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health > /tmp/shalcon-health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/shalcon-worker.log
            exit 1
          fi

          cat /tmp/shalcon-health.json
      - run: npm run test:phase0:audit
      - run: npm run test:phase1:audit
      - run: npm run test:phase2:audit
      - run: npm run test:phase3:audit
      - run: npm run test:phase4:audit
      - run: npm run test:phase5:audit
      - run: npm run test:phase6:audit
      - run: npm run test:phase7:audit
      - run: npm run test:phase8:audit
      - run: npm run test:phase9:audit

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e 'apps/local-runner[dev]'
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m pytest apps/local-runner/tests -q
