[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shalcon-local-runner"
version = "0.1.0"
description = "Local execution plane for the Shalcon Demo-First Outbound Engine"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.62.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
ai = [
  "scrapegraphai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
